      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingInput" }
            example: { score: 5, comment: Smooth ride and polite driver. }
      responses:
        "201":
          description: Rating saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RatingResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Ratings & Reviews]
      operationId: getRideRating
      x-status: planned
      x-required-role: PASSENGER, DRIVER, ADMIN
      summary: "[PLANNED] Get ratings for a ride"
      description: "**Planned.** **Auth:** Bearer JWT · **Role:** the ride's passenger or driver, or ADMIN."
      responses:
        "200":
          description: Ratings given for this ride.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Ratings fetched successfully. }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Rating" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # NOTIFICATIONS (planned)
  # ===========================================================================
  /api/notifications:
