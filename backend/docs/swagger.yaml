      summary: "[PLANNED] Pay for a completed ride"
      description: |
        **Planned.** **Auth:** Bearer JWT · **Role:** the ride's PASSENGER.

        Creates the payment for a `COMPLETED` ride. The payment gateway is not chosen yet; for
        online methods the response is expected to include gateway data for the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: "#/components/schemas/PaymentMethod" }
            example: { method: UPI }
      responses:
        "201":
          description: Payment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/payments/{paymentId}:
