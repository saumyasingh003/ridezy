components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT from `POST /api/auth/login`. Payload: `sub` = user id, `role` = PASSENGER | DRIVER | ADMIN."

  parameters:
    PlaceId:
      name: placeId
      in: path
      required: true
      description: Saved place id (from `savedPlaces[].id`).
      schema: { $ref: "#/components/schemas/ObjectId" }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Document id (from `GET /api/drivers/documents`).
      schema: { $ref: "#/components/schemas/ObjectId" }
    DriverId:
      name: driverId
      in: path
      required: true
      description: Driver **profile** id (`DriverProfile.id`), not the user id.
      schema: { $ref: "#/components/schemas/ObjectId" }
    RideId:
      name: rideId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ObjectId" }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ObjectId" }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ObjectId" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Request body, query or path parameter failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
    Unauthorized:
      description: Missing, invalid or expired JWT.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            missing: { value: { success: false, message: Authentication required. } }
            invalid: { value: { success: false, message: Invalid or expired token. } }
    Forbidden:
      description: Authenticated, but the role is not allowed to use this endpoint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { success: false, message: You do not have permission to perform this action. }
    NotFound:
      description: The resource doesn't exist, or doesn't belong to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { success: false, message: Driver profile not found. Create one first. }
    Conflict:
      description: Conflicts with existing data (duplicate value or invalid state).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { success: false, message: A record with these details already exists. }
    TooManyRequests:
      description: Rate limit exceeded. See the `RateLimit` / `RateLimit-Policy` response headers.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { success: false, message: Too many requests. Please try again later. }

  schemas:
    # ---------------------------------------------------------------- common
    ObjectId:
      type: string
      pattern: "^[a-f0-9]{24}$"
      example: 6ac49c10dc4a882c54446f3f
    Phone:
      type: string
      description: E.164. A 10-digit Indian mobile is accepted on input and stored with +91.
      example: "+919876543210"
    Timestamps:
      type: object
      properties:
        createdAt: { type: string, format: date-time, example: "2026-10-06T07:45:08.346Z" }
        updatedAt: { type: string, format: date-time, example: "2026-10-06T07:45:08.346Z" }
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Operation completed successfully. }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Driver profile not found. }
        stack:
          type: string
          description: Only for 5xx errors in development; never in production.
    ValidationErrorResponse:
      type: object
      required: [success, message, errors]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Validation failed. }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: phone }
              message: { type: string, example: "Enter a valid phone number, e.g. 9876543210 or +919876543210" }
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        pages: { type: integer, example: 3 }
    Money:
      type: object
      x-status: planned
      properties:
        amount: { type: number, example: 89 }
        currency: { type: string, example: INR }
    # ---------------------------------------------------------------- enums
    Role:
      type: string
      enum: [PASSENGER, DRIVER, ADMIN]
    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
    VehicleType:
      type: string
      enum: [BIKE, AUTO, CAB]
    DriverAvailability:
      type: string
      enum: [OFFLINE, AVAILABLE, BUSY]
      description: "Stored on DriverProfile (default OFFLINE). Drivers set AVAILABLE/OFFLINE; BUSY is set by the ride flow."
    DocumentType:
      type: string
      description: Documents a driver must submit. AADHAAR number = 12 digits (not starting with 0 or 1); DRIVING_LICENSE number = 8-20 letters/digits.
      enum: [AADHAAR, DRIVING_LICENSE]
    SavedPlaceType:
      type: string
      enum: [HOME, WORK, OTHER]
    RideStatus:
      type: string
      description: |
        SEARCHING → DRIVER_ASSIGNED → DRIVER_ARRIVING → DRIVER_ARRIVED → RIDE_STARTED → RIDE_COMPLETED;
        CANCELLED from any state before RIDE_STARTED. Only defined transitions are allowed.
        Currently used: SEARCHING, DRIVER_ASSIGNED, CANCELLED.
      enum: [SEARCHING, DRIVER_ASSIGNED, DRIVER_ARRIVING, DRIVER_ARRIVED, RIDE_STARTED, RIDE_COMPLETED, CANCELLED]
    PaymentMethod:
      type: string
      x-status: planned
      enum: [CASH, UPI, CARD]
    PaymentStatus:
      type: string
      x-status: planned
      enum: [PENDING, COMPLETED, FAILED, REFUNDED]

    # ------------------------------------------------------------ auth (implemented)
    User:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        name: { type: string, example: Saumya Singh }
        email: { type: string, format: email, example: saumya@example.com }
        phone:
          type: string
          allOf: [{ $ref: "#/components/schemas/Phone" }]
          nullable: true
        role: { $ref: "#/components/schemas/Role" }
        isEmailVerified: { type: boolean, example: true }
    RegisterRequest:
      type: object
      required: [name, email, phone, password, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 50, example: Saumya Singh }
        email: { type: string, format: email, maxLength: 254, example: saumya@example.com }
        phone: { type: string, example: "9876543210" }
        password:
          type: string
          format: password
          minLength: 8
          description: 8–72 bytes, at least one uppercase letter, one lowercase letter and one digit.
          example: StrongPassword123
        role:
          type: string
          enum: [PASSENGER, DRIVER]
          description: ADMIN is rejected.
    VerifyEmailRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email, example: saumya@example.com }
        otp: { type: string, pattern: "^\\d{6}$", example: "482913" }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: saumya@example.com }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: saumya@example.com }
        password: { type: string, format: password, example: StrongPassword123 }
    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Logged in successfully. }
        data:
          type: object
          properties:
            token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiUEFTU0VOR0VSIiwic3ViIjoiNmFjNDljMTAifQ.signature }
            user: { $ref: "#/components/schemas/User" }

    # ------------------------------------------------------- passenger (implemented)
    SavedPlace:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        type: { $ref: "#/components/schemas/SavedPlaceType" }
        label: { type: string, example: Home }
        address: { type: string, example: "12 MG Road, Patna, Bihar" }
        latitude: { type: number, example: 25.6093 }
        longitude: { type: number, example: 85.1376 }
    SavedPlaceInput:
      type: object
      required: [type, address, latitude, longitude]
      properties:
        type: { $ref: "#/components/schemas/SavedPlaceType" }
        label: { type: string, maxLength: 50, description: Defaults to Home / Work / Other., example: Home }
        address: { type: string, minLength: 5, maxLength: 300, example: "12 MG Road, Patna, Bihar" }
        latitude: { type: number, minimum: -90, maximum: 90, example: 25.6093 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 85.1376 }
    SavedPlaceUpdate:
      type: object
      minProperties: 1
      properties:
        type: { $ref: "#/components/schemas/SavedPlaceType" }
        label: { type: string, minLength: 1, maxLength: 50, example: My flat }
        address: { type: string, minLength: 5, maxLength: 300 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    PassengerProfileInput:
      type: object
      description: All fields optional. On PATCH at least one is required; `null` clears an optional field.
      properties:
        phone: { type: string, example: "9876543210" }
        profileImage: { type: string, format: uri, nullable: true, example: "https://example.com/profile.jpg" }
        dateOfBirth: { type: string, format: date, nullable: true, example: "2003-04-15" }
        gender:
          type: string
          allOf: [{ $ref: "#/components/schemas/Gender" }]
          nullable: true
    PassengerProfile:
      allOf:
        - type: object
          properties:
            id: { $ref: "#/components/schemas/ObjectId" }
            name: { type: string, example: Saumya Singh }
            email: { type: string, format: email, example: saumya@example.com }
            phone:
              type: string
              allOf: [{ $ref: "#/components/schemas/Phone" }]
              nullable: true
            profileImage: { type: string, format: uri, example: "https://example.com/profile.jpg" }
            dateOfBirth: { type: string, format: date-time, example: "2003-04-15T00:00:00.000Z" }
            gender: { $ref: "#/components/schemas/Gender" }
            savedPlaces:
              type: array
              items: { $ref: "#/components/schemas/SavedPlace" }
        - $ref: "#/components/schemas/Timestamps"
    PassengerProfileResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Profile updated successfully. }
        data: { $ref: "#/components/schemas/PassengerProfile" }

    # ---------------------------------------------------------- driver (implemented)
    DriverProfileCreate:
      type: object
      required: [licenseNumber]
      properties:
        phone: { type: string, example: "9123456789" }
        profileImage: { type: string, format: uri, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true, description: Driver must be at least 18., example: "1995-08-20" }
        gender:
          type: string
          allOf: [{ $ref: "#/components/schemas/Gender" }]
          nullable: true
        licenseNumber: { type: string, minLength: 8, maxLength: 20, description: "Normalised (spaces/dashes removed, upper-cased).", example: BR0120230001234 }
    DriverProfileUpdate:
      type: object
      minProperties: 1
      description: At least one field. Status fields are not accepted.
      properties:
        phone: { type: string, example: "9123456789" }
        profileImage: { type: string, format: uri, nullable: true, example: "https://example.com/driver.jpg" }
        dateOfBirth: { type: string, format: date, nullable: true }
        gender:
          type: string
          allOf: [{ $ref: "#/components/schemas/Gender" }]
          nullable: true
        licenseNumber: { type: string, minLength: 8, maxLength: 20, description: Changing it resets verification to PENDING. }
    DriverProfile:
      description: The driver's own view (admin audit fields hidden).
      allOf:
        - type: object
          properties:
            id: { $ref: "#/components/schemas/ObjectId" }
            name: { type: string, example: Ravi Kumar }
            email: { type: string, format: email, example: ravi@example.com }
            phone:
              type: string
              allOf: [{ $ref: "#/components/schemas/Phone" }]
              nullable: true
            profileImage: { type: string, format: uri }
            dateOfBirth: { type: string, format: date-time, example: "1995-08-20T00:00:00.000Z" }
            gender: { $ref: "#/components/schemas/Gender" }
            licenseNumber: { type: string, example: BR0120230001234 }
            verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
            verifiedAt: { type: string, format: date-time, description: Set when VERIFIED. }
            rejectionReason: { type: string, description: Set when REJECTED., example: Driving license image is unclear. }
            availabilityStatus: { $ref: "#/components/schemas/DriverAvailability" }
        - $ref: "#/components/schemas/Timestamps"
    DriverProfileResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Driver profile fetched successfully. }
        data: { $ref: "#/components/schemas/DriverProfile" }
    AdminDriverProfile:
      description: The admin's view of a driver profile.
      allOf:
        - type: object
          properties:
            id: { $ref: "#/components/schemas/ObjectId" }
            userId: { $ref: "#/components/schemas/ObjectId" }
            profileImage: { type: string, format: uri }
            dateOfBirth: { type: string, format: date-time }
            gender: { $ref: "#/components/schemas/Gender" }
            licenseNumber: { type: string, example: BR0120230001234 }
            verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
            verifiedAt: { type: string, format: date-time }
            reviewedBy:
              allOf: [{ $ref: "#/components/schemas/ObjectId" }]
              description: Admin who verified or rejected the driver.
            rejectionReason: { type: string }
            availabilityStatus: { $ref: "#/components/schemas/DriverAvailability" }
        - $ref: "#/components/schemas/Timestamps"
    AdminDriverProfileResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Driver verified successfully. }
        data: { $ref: "#/components/schemas/AdminDriverProfile" }
    PendingDriver:
      allOf:
        - $ref: "#/components/schemas/AdminDriverProfile"
        - type: object
          properties:
            user:
              type: object
              nullable: true
              properties:
                name: { type: string, example: Ravi Kumar }
                email: { type: string, example: ravi@example.com }
                phone:
                  type: string
                  allOf: [{ $ref: "#/components/schemas/Phone" }]
                  nullable: true
            vehicle:
              type: object
              allOf: [{ $ref: "#/components/schemas/Vehicle" }]
              nullable: true
            documents:
              type: array
              items: { $ref: "#/components/schemas/DriverDocument" }
            missing:
              type: array
              description: Items still required before the driver can be verified.
              items: { type: string, enum: [VEHICLE, AADHAAR, DRIVING_LICENSE] }
              example: [AADHAAR]
    PendingDriversResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Pending drivers fetched successfully. }
        data:
          type: object
          properties:
            drivers:
              type: array
              items: { $ref: "#/components/schemas/PendingDriver" }
            pagination: { $ref: "#/components/schemas/Pagination" }
    RejectDriverRequest:
      type: object
      required: [rejectionReason]
      properties:
        rejectionReason: { type: string, minLength: 5, maxLength: 500, example: Driving license image is unclear. }
        documentTypes:
          type: array
          description: Optional. These documents are marked REJECTED with the same reason.
          items: { $ref: "#/components/schemas/DocumentType" }
          example: [DRIVING_LICENSE]

    # --------------------------------------------------------- vehicle (implemented)
    VehicleInput:
      type: object
      required: [vehicleType, make, model, year, color, registrationNumber]
      properties:
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        make: { type: string, maxLength: 50, example: Honda }
        model: { type: string, maxLength: 50, example: Shine }
        year: { type: integer, minimum: 1990, description: Up to next calendar year., example: 2024 }
        color: { type: string, minLength: 2, maxLength: 30, example: Black }
        registrationNumber: { type: string, minLength: 4, maxLength: 12, description: Normalised and unique., example: BR01AB1234 }
        vehicleImage: { type: string, format: uri, nullable: true }
    VehicleUpdate:
      type: object
      minProperties: 1
      description: Any subset of VehicleInput fields; at least one.
      properties:
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        make: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 50 }
        year: { type: integer, minimum: 1990 }
        color: { type: string, minLength: 2, maxLength: 30, example: Red }
        registrationNumber: { type: string, minLength: 4, maxLength: 12 }
        vehicleImage: { type: string, format: uri, nullable: true }
    Vehicle:
      allOf:
        - type: object
          properties:
            id: { $ref: "#/components/schemas/ObjectId" }
            driverId:
              allOf: [{ $ref: "#/components/schemas/ObjectId" }]
              description: DriverProfile id.
            vehicleType: { $ref: "#/components/schemas/VehicleType" }
            make: { type: string, example: Honda }
            model: { type: string, example: Shine }
            year: { type: integer, example: 2024 }
            color: { type: string, example: Black }
            registrationNumber: { type: string, example: BR01AB1234 }
            vehicleImage: { type: string, format: uri }
        - $ref: "#/components/schemas/Timestamps"
    VehicleResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Vehicle fetched successfully. }
        data: { $ref: "#/components/schemas/Vehicle" }

    # ------------------------------------------------ driver documents (implemented)
    DriverDocumentInput:
      type: object
      required: [documentType, documentNumber, documentUrl]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, description: "Format depends on documentType (see DocumentType).", example: "234123412341" }
        documentUrl: { type: string, format: uri, maxLength: 2048, example: "https://files.example.com/aadhaar.jpg" }
    DriverDocumentUpdate:
      type: object
      minProperties: 1
      properties:
        documentNumber: { type: string, minLength: 4, maxLength: 30 }
        documentUrl: { type: string, format: uri, maxLength: 2048, example: "https://files.example.com/driving-license-clear.jpg" }
    DriverDocument:
      allOf:
        - type: object
          properties:
            id: { $ref: "#/components/schemas/ObjectId" }
            driverId:
              allOf: [{ $ref: "#/components/schemas/ObjectId" }]
              description: DriverProfile id.
            documentType: { $ref: "#/components/schemas/DocumentType" }
            documentNumber: { type: string, example: BR0120230001234 }
            documentUrl: { type: string, format: uri, example: "https://files.example.com/driving-license.jpg" }
            verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
            rejectionReason: { type: string }
            verifiedAt: { type: string, format: date-time }
        - $ref: "#/components/schemas/Timestamps"
    DriverDocumentResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Document submitted for verification. }
        data: { $ref: "#/components/schemas/DriverDocument" }
    DriverDocumentListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Documents fetched successfully. }
        data:
          type: array
          items: { $ref: "#/components/schemas/DriverDocument" }

    # ----------------------------------------------------------------- health
    HealthReport:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded], example: ok }
        timestamp: { type: string, format: date-time, example: "2026-10-06T07:45:08.346Z" }
        uptime: { type: integer, description: Seconds since process start., example: 3600 }
        services:
          type: object
          properties:
            database: { type: string, enum: [up, down], example: up }

    AvailabilityRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [AVAILABLE, OFFLINE]
          description: BUSY is set by the ride flow, never by the driver.
    DriverLocationInput:
      type: object
      required: [latitude, longitude]
      description: Both fields are required. Stored as GeoJSON [longitude, latitude].
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, example: 25.5941 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 85.1376 }
    DriverLocation:
      type: object
      properties:
        availabilityStatus: { $ref: "#/components/schemas/DriverAvailability" }
        latitude: { type: number, nullable: true, example: 25.5941 }
        longitude: { type: number, nullable: true, example: 85.1376 }
        lastLocationUpdatedAt: { type: string, format: date-time, nullable: true, example: "2026-10-06T09:30:00.000Z" }
        isLocationStale: { type: boolean, example: false }
    DriverLocationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Location updated successfully. }
        data: { $ref: "#/components/schemas/DriverLocation" }
    NearbyDriver:
      type: object
      description: Internal search result (admin view). Never returned to passengers.
      properties:
        driverId:
          allOf: [{ $ref: "#/components/schemas/ObjectId" }]
          description: DriverProfile id.
        userId: { $ref: "#/components/schemas/ObjectId" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        distanceMeters: { type: number, example: 1001 }
        latitude: { type: number, example: 25.6031 }
        longitude: { type: number, example: 85.1376 }
        lastLocationUpdatedAt: { type: string, format: date-time }

    # ------------------------------------------------------------ rides (implemented)
    Place:
      type: object
      required: [address, latitude, longitude]
      properties:
        address: { type: string, minLength: 3, maxLength: 300, example: "Boring Road, Patna" }
        latitude: { type: number, minimum: -90, maximum: 90, example: 25.6127 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 85.1589 }
    RideRequest:
      type: object
      required: [pickup, destination, vehicleType]
      description: Only these fields are read. Distance, duration and fare are always calculated by the server.
      properties:
        pickup: { $ref: "#/components/schemas/Place" }
        destination: { $ref: "#/components/schemas/Place" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
    RideEstimate:
      type: object
      properties:
        pickup: { $ref: "#/components/schemas/Place" }
        destination: { $ref: "#/components/schemas/Place" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        distanceKm: { type: number, example: 4.7 }
        durationMinutes: { type: integer, example: 6 }
        estimatedFare: { type: number, description: Whole rupees., example: 58 }
        currency: { type: string, example: INR }
        fareBreakdown:
          type: object
          properties:
            baseFare: { type: number, example: 20 }
            distanceFare: { type: number, example: 38 }
            minimumFare: { type: number, example: 30 }
        routeSource: { type: string, enum: [OSRM, ESTIMATED], example: OSRM }
        routeGeometry: { type: string, nullable: true, description: Encoded polyline (precision 5)., example: "ekeyCeqygO..." }
    RideEstimateResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Ride estimate calculated successfully. }
        data: { $ref: "#/components/schemas/RideEstimate" }
    AssignedDriver:
      type: object
      description: Public driver details only. No phone, licence, documents or live location.
      properties:
        name: { type: string, example: Ravi Kumar }
        profileImage: { type: string, format: uri, nullable: true }
        rating: { type: number, nullable: true, description: Ratings are not implemented yet (always null)., example: null }
        vehicle:
          type: object
          nullable: true
          properties:
            vehicleType: { $ref: "#/components/schemas/VehicleType" }
            make: { type: string, example: Honda }
            model: { type: string, example: Shine }
            color: { type: string, example: Black }
            registrationNumber: { type: string, example: BR01AB1234 }
    Ride:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        status: { $ref: "#/components/schemas/RideStatus" }
        pickup: { $ref: "#/components/schemas/Place" }
        destination: { $ref: "#/components/schemas/Place" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        distanceKm: { type: number, example: 4.7 }
        estimatedDurationMinutes: { type: integer, example: 6 }
        estimatedFare: { type: number, example: 58 }
        currency: { type: string, example: INR }
        routeSource: { type: string, enum: [OSRM, ESTIMATED] }
        assignedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledBy: { type: string, enum: [PASSENGER, DRIVER, SYSTEM], nullable: true }
        cancellationReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        driver:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AssignedDriver" }]
        passenger:
          type: object
          description: Only for DRIVER and ADMIN viewers.
          properties:
            name: { type: string, example: Saumya Singh }
        matching:
          type: object
          description: Only for ADMIN viewers.
          properties:
            offeredDriverIds: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
            rejectedDriverIds: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
            matchingAttempts: { type: integer, example: 1 }
    RideResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Ride fetched successfully. }
        data: { $ref: "#/components/schemas/Ride" }
    BookRideResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message:
          type: string
          description: '"Ride booked. Looking for a driver." or "No drivers are currently available. We''ll keep searching."'
          example: Ride booked. Looking for a driver.
        data:
          allOf:
            - $ref: "#/components/schemas/Ride"
            - type: object
              properties:
                driversContacted: { type: integer, description: How many drivers the ride was offered to., example: 3 }
    RideOffer:
      allOf:
        - $ref: "#/components/schemas/Ride"
        - type: object
          properties:
            distanceToPickupKm: { type: number, nullable: true, example: 1.2 }
    RideOfferListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Ride requests fetched successfully. }
        data:
          type: array
          items: { $ref: "#/components/schemas/RideOffer" }
    RideListResponse:
      type: object
      x-status: planned
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Rides fetched successfully. }
        data:
          type: object
          properties:
            rides:
              type: array
              items: { $ref: "#/components/schemas/Ride" }
            pagination: { $ref: "#/components/schemas/Pagination" }
    CancelRideRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 300, example: Changed my plans }

