                color: { type: string, example: Black }
                registrationNumber: { type: string, example: BR01AB1234 }
            location:
              type: object
              allOf: [{ $ref: "#/components/schemas/DriverLocation" }]
              nullable: true
            averageRating: { type: number, nullable: true, example: 4.8 }
    Payment:
