openapi: 3.0.3

info:
  title: Ridezy API
  version: 1.0.0

servers:
  - url: http://localhost:5000

# Every operation requires a JWT unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: "**Implemented.** Registration, email OTP verification, login and current user."
  - name: Passenger
    description: "**Implemented.** Passenger profile and saved places. Role: PASSENGER."
  - name: Driver
    description: "**Implemented.** Driver profile and vehicle. Role: DRIVER."
  - name: Driver Documents
    description: "**Implemented.** Aadhaar and driving licence submitted by drivers for verification. Role: DRIVER."
  - name: Driver Location
    description: "**Implemented.** Driver availability (online/offline) and current location. Role: DRIVER."
  - name: Rides
    description: "**Implemented** (history, start and complete are planned). Fare estimate, booking, ride details, cancellation, and driver accept/reject."
  - name: Ride Matching
    description: "Matching runs inside the backend when a ride is booked (implemented as a service, no public endpoint). The endpoints below are **planned**."
  - name: Payments
    description: "**Planned.** Ride payments and payment history."
  - name: Ratings & Reviews
    description: "**Planned.** Post-ride ratings between passenger and driver."
  - name: Notifications
    description: "**Planned.** In-app notifications."
  - name: Admin
    description: "**Partly implemented.** Driver verification is implemented; user/ride/payment management and analytics are planned. Role: ADMIN."
  - name: Health
    description: "**Implemented.** Liveness and database status."

paths:
  # ===========================================================================
  # AUTHENTICATION (implemented)
  # ===========================================================================
  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      x-status: implemented
      x-required-role: none
      summary: Register a passenger or driver
      description: |
        **Auth:** none · **Rate limit:** 20 requests / 15 min per IP.

        Creates an unverified account and emails a 6-digit OTP (valid 10 minutes).
        `role` must be `PASSENGER` or `DRIVER`; **ADMIN cannot be registered publicly**
        (admins are created with the `npm run create-admin` script).
        Password: 8–72 bytes with an uppercase letter, a lowercase letter and a digit.
        The OTP is never returned in the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            example:
              name: Saumya Singh
              email: saumya@example.com
              phone: "9876543210"
              password: StrongPassword123
              role: PASSENGER
      responses:
        "201":
          description: Account created and verification email sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
              example: { success: true, message: Registration successful. Verification email sent successfully. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Email or phone already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                email: { value: { success: false, message: An account with this email already exists. } }
                phone: { value: { success: false, message: An account with this phone number already exists. } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Account created but the email could not be sent. Use `POST /api/auth/resend-otp`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: "Account created, but we couldn't send the verification email. Please request a new code." }

  /api/auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      x-status: implemented
      x-required-role: none
      summary: Verify email with the 6-digit OTP
      description: |
        **Auth:** none · **Rate limit:** 20 requests / 15 min per IP.

        Marks the email as verified. An OTP is single-use, expires after 10 minutes and allows
        5 attempts; after that a new code must be requested. Unknown email, wrong code, expired
        code and used code all return the same message so the endpoint reveals nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
            example: { email: saumya@example.com, otp: "482913" }
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
              example: { success: true, message: Email verified successfully. You can now log in. }
        "400":
          description: Validation failed, invalid/expired OTP, or email already verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                invalidOtp: { value: { success: false, message: Invalid or expired OTP. } }
                alreadyVerified: { value: { success: false, message: Email is already verified. } }
        "429":
          description: Attempt limit reached for this OTP, or IP rate limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Too many incorrect attempts. Please request a new code. }

  /api/auth/resend-otp:
    post:
      tags: [Authentication]
      operationId: resendOtp
      x-status: implemented
      x-required-role: none
      summary: Send a new verification OTP
      description: |
        **Auth:** none · **Rate limit:** 5 requests / hour per IP, plus a 60-second cooldown per account.

        Replaces any previous OTP (only one active OTP per user). The response is identical whether
        or not the email exists or is already verified, to prevent account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
            example: { email: saumya@example.com }
      responses:
        "200":
          description: Generic confirmation (sent if an unverified account exists).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
              example: { success: true, message: "If an unverified account exists for this email, a new verification code has been sent." }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Cooldown active (60 s since the last code) or IP rate limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Please wait before requesting another code. }

  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      x-status: implemented
      x-required-role: none
      summary: Log in and receive a JWT
      description: |
        **Auth:** none · **Rate limit:** 10 failed attempts / 15 min per IP.

        Returns a JWT (default lifetime 7 days) and the public user. Unknown email and wrong password
        return the same 401 message. Unverified accounts get 403 (only after a correct password).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: saumya@example.com, password: StrongPassword123 }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Wrong email or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Invalid email or password. }
        "403":
          description: Email not verified yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Please verify your email before logging in. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getMe
      x-status: implemented
      x-required-role: any
      summary: Get the authenticated user
      description: "**Auth:** Bearer JWT · **Role:** any. Returns the current user from the database (never the password)."
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ===========================================================================
  # PASSENGER (implemented)
  # ===========================================================================
  /api/passengers/profile:
    post:
      tags: [Passenger]
      operationId: createPassengerProfile
      x-status: implemented
      x-required-role: PASSENGER
      summary: Create the passenger profile
      description: |
        **Auth:** Bearer JWT · **Role:** PASSENGER.

        Creates the caller's profile (one per passenger). The owner is taken from the JWT;
        any `userId` in the body is ignored. `phone` is stored on the user account.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerProfileInput" }
            example: { phone: "9876543210", gender: FEMALE, dateOfBirth: "2003-04-15" }
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Profile already exists, or phone number used by another account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Passenger profile already exists. Use PATCH to update it. }
    get:
      tags: [Passenger]
      operationId: getPassengerProfile
      x-status: implemented
      x-required-role: PASSENGER
      summary: Get the passenger profile
      description: "**Auth:** Bearer JWT · **Role:** PASSENGER. Returns the caller's profile with name, email and phone."
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Passenger]
      operationId: updatePassengerProfile
      x-status: implemented
      x-required-role: PASSENGER
      summary: Update the passenger profile
      description: |
        **Auth:** Bearer JWT · **Role:** PASSENGER.

        Partial update; at least one field is required. `null` clears `profileImage`,
        `dateOfBirth` or `gender`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerProfileInput" }
            example: { phone: "9876543210", profileImage: "https://example.com/profile.jpg", dateOfBirth: "2003-04-15" }
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Passenger]
      operationId: deletePassengerProfile
      x-status: implemented
      x-required-role: PASSENGER
      summary: Delete the passenger profile
      description: "**Auth:** Bearer JWT · **Role:** PASSENGER. Deletes the profile and its saved places. The user account itself is kept."
      responses:
        "200":
          description: Profile deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
              example: { success: true, message: Passenger profile deleted successfully. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/passengers/saved-places:
    post:
      tags: [Passenger]
      operationId: addSavedPlace
      x-status: implemented
      x-required-role: PASSENGER
      summary: Add a saved place
      description: |
        **Auth:** Bearer JWT · **Role:** PASSENGER.

        At most one `HOME` and one `WORK` place, and 20 places in total. `label` defaults to
        "Home" / "Work" / "Other". Coordinates are stored as given (no geocoding).
        Returns the full updated profile; the new place's `id` is used as `{placeId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedPlaceInput" }
            example: { type: HOME, label: Home, address: "12 MG Road, Patna, Bihar", latitude: 25.6093, longitude: 85.1376 }
      responses:
        "201":
          description: Place added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A HOME/WORK place already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: You already have a HOME place. Update it instead. }

  /api/passengers/saved-places/{placeId}:
    parameters:
      - $ref: "#/components/parameters/PlaceId"
    patch:
      tags: [Passenger]
      operationId: updateSavedPlace
      x-status: implemented
      x-required-role: PASSENGER
      summary: Update a saved place
      description: "**Auth:** Bearer JWT · **Role:** PASSENGER. Partial update of one of the caller's places; at least one field is required."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedPlaceUpdate" }
            example: { label: My flat }
      responses:
        "200":
          description: Place updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Passenger]
      operationId: deleteSavedPlace
      x-status: implemented
      x-required-role: PASSENGER
      summary: Delete a saved place
      description: "**Auth:** Bearer JWT · **Role:** PASSENGER. Removes one of the caller's places and returns the updated profile."
      responses:
        "200":
          description: Place deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # DRIVER (implemented)
  # ===========================================================================
  /api/drivers/profile:
    post:
      tags: [Driver]
      operationId: createDriverProfile
      x-status: implemented
      x-required-role: DRIVER
      summary: Create the driver profile
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER.

        Creates the caller's profile (one per driver) with `verificationStatus: PENDING` and
        `availabilityStatus: OFFLINE`. Status fields in the body are ignored. Drivers must be 18+
        if `dateOfBirth` is given. `licenseNumber` must be unique across drivers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverProfileCreate" }
            example: { phone: "9123456789", licenseNumber: BR0120230001234, dateOfBirth: "1995-08-20", gender: MALE }
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Profile already exists, licence number taken, or phone number taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                exists: { value: { success: false, message: Driver profile already exists. Use PATCH to update it. } }
                license: { value: { success: false, message: This license number is already registered to another driver. } }
    get:
      tags: [Driver]
      operationId: getDriverProfile
      x-status: implemented
      x-required-role: DRIVER
      summary: Get the driver profile
      description: "**Auth:** Bearer JWT · **Role:** DRIVER. Returns the caller's profile, verification status and contact details."
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Driver]
      operationId: updateDriverProfile
      x-status: implemented
      x-required-role: DRIVER
      summary: Update the driver profile
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER.

        Partial update; at least one field. Changing `licenseNumber` on a VERIFIED or REJECTED
        driver resets `verificationStatus` to **PENDING** (needs admin review again).
        `verificationStatus`, `verifiedAt`, `rejectionReason` and `availabilityStatus` cannot be set here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverProfileUpdate" }
            example: { profileImage: "https://example.com/driver.jpg" }
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/drivers/vehicle:
    post:
      tags: [Driver]
      operationId: addVehicle
      x-status: implemented
      x-required-role: DRIVER
      summary: Add the driver's vehicle
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER.

        One vehicle per driver (MVP). `registrationNumber` is normalised (`br 01 ab-1234` → `BR01AB1234`)
        and must be unique. Adding a vehicle resets a VERIFIED/REJECTED driver to PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
            example: { vehicleType: BIKE, make: Honda, model: Shine, year: 2024, color: Black, registrationNumber: BR01AB1234 }
      responses:
        "201":
          description: Vehicle added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Driver already has a vehicle, or registration number taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                exists: { value: { success: false, message: You already have a vehicle. Use PATCH to update it. } }
                registration: { value: { success: false, message: A vehicle with this registration number is already registered. } }
    get:
      tags: [Driver]
      operationId: getVehicle
      x-status: implemented
      x-required-role: DRIVER
      summary: Get the driver's vehicle
      description: "**Auth:** Bearer JWT · **Role:** DRIVER."
      responses:
        "200":
          description: Vehicle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Driver]
      operationId: updateVehicle
      x-status: implemented
      x-required-role: DRIVER
      summary: Update the driver's vehicle
      description: "**Auth:** Bearer JWT · **Role:** DRIVER. Partial update; resets a VERIFIED/REJECTED driver to PENDING."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleUpdate" }
            example: { color: Red }
      responses:
        "200":
          description: Vehicle updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Driver]
      operationId: deleteVehicle
      x-status: implemented
      x-required-role: DRIVER
      summary: Delete the driver's vehicle
      description: "**Auth:** Bearer JWT · **Role:** DRIVER. Resets a VERIFIED/REJECTED driver to PENDING."
      responses:
        "200":
          description: Vehicle deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
              example: { success: true, message: Vehicle deleted successfully. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # DRIVER DOCUMENTS (implemented)
  # ===========================================================================
  /api/drivers/documents:
    post:
      tags: [Driver Documents]
      operationId: submitDocument
      x-status: implemented
      x-required-role: DRIVER
      summary: Submit a verification document
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER.

        Two documents are required: `AADHAAR` and `DRIVING_LICENSE` (one of each). `documentUrl`
        points to where the file is stored; files are not uploaded to this API. New documents start as
        PENDING; status fields in the body are ignored.

        Numbers are normalised (spaces/dashes removed, upper-cased) and checked per type:
        Aadhaar = 12 digits not starting with 0 or 1; driving licence = 8-20 letters/digits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverDocumentInput" }
            examples:
              aadhaar:
                summary: Aadhaar card
                value: { documentType: AADHAAR, documentNumber: "2341 2341 2341", documentUrl: "https://files.example.com/aadhaar.jpg" }
              drivingLicense:
                summary: Driving licence
                value: { documentType: DRIVING_LICENSE, documentNumber: BR0120230001234, documentUrl: "https://files.example.com/driving-license.jpg" }
      responses:
        "201":
          description: Document submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocumentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A document of this type was already submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: You already submitted this document type. Use PATCH to replace it. }
    get:
      tags: [Driver Documents]
      operationId: listDocuments
      x-status: implemented
      x-required-role: DRIVER
      summary: List the driver's documents
      description: "**Auth:** Bearer JWT · **Role:** DRIVER. The caller's AADHAAR and DRIVING_LICENSE documents, sorted by `documentType`."
      responses:
        "200":
          description: Documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocumentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/drivers/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    patch:
      tags: [Driver Documents]
      operationId: updateDocument
      x-status: implemented
      x-required-role: DRIVER
      summary: Re-submit a document
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER.

        Replaces the number and/or file of one of the caller's documents (the type can't change).
        A new number must match the document's type (Aadhaar = 12 digits). The document goes back
        to PENDING and so does the driver. Another driver's document returns **404**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverDocumentUpdate" }
            example: { documentUrl: "https://files.example.com/driving-license-clear.jpg" }
      responses:
        "200":
          description: Document re-submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocumentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # DRIVER LOCATION & AVAILABILITY (implemented)
  # ===========================================================================
  /api/drivers/availability:
    patch:
      tags: [Driver Location]
      operationId: updateAvailability
      x-status: implemented
      x-required-role: DRIVER
      summary: Go online (AVAILABLE) or offline
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER.

        `AVAILABLE` requires: verified email, a driver profile with `verificationStatus: VERIFIED`,
        a vehicle, and a location sent within `LOCATION_STALE_AFTER_SECONDS` (default 60 s).
        Send `PATCH /api/drivers/location` first. Repeating the current status is allowed.

        `OFFLINE` also deletes the stored location. `BUSY` cannot be set by the driver, and a BUSY
        driver cannot change status (managed by the ride flow).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityRequest" }
            examples:
              online: { value: { status: AVAILABLE } }
              offline: { value: { status: OFFLINE } }
      responses:
        "200":
          description: Status changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverLocationResponse" }
              example:
                success: true
                message: You are now online.
                data: { availabilityStatus: AVAILABLE, latitude: 25.5941, longitude: 85.1376, lastLocationUpdatedAt: "2026-10-06T09:30:00.000Z", isLocationStale: false }
        "400":
          description: Validation failed, no vehicle, or location missing/stale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                noVehicle: { value: { success: false, message: Add a vehicle before going online. } }
                noLocation: { value: { success: false, message: Share your current location before going online. } }
                stale: { value: { success: false, message: Your location is out of date. Send a fresh location update before going online. } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Wrong role, email not verified, or driver not VERIFIED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Your driver account is PENDING. Only verified drivers can go online. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Driver is BUSY, or the status changed concurrently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: You are on a ride. Availability will update when the ride ends. }

  /api/drivers/location:
    patch:
      tags: [Driver Location]
      operationId: updateLocation
      x-status: implemented
      x-required-role: DRIVER
      summary: Update current location
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER (VERIFIED only) · **Rate limit:** 120 / minute per driver.

        Stores the current position as GeoJSON `[longitude, latitude]` with `lastLocationUpdatedAt`.
        Only the current position is kept (no history). Ids in the body are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverLocationInput" }
            example: { latitude: 25.5941, longitude: 85.1376 }
      responses:
        "200":
          description: Location stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverLocationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Wrong role, or driver not VERIFIED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Only verified drivers can share their location. }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Driver Location]
      operationId: getLocation
      x-status: implemented
      x-required-role: DRIVER
      summary: Get own current location
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER. The caller's own location only; no endpoint returns
        other drivers' locations. `isLocationStale` is true when the last update is older than
        `LOCATION_STALE_AFTER_SECONDS`.
      responses:
        "200":
          description: Current location.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverLocationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No driver profile, or no location shared yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: No location shared yet. Send PATCH /api/drivers/location first. }

  # ===========================================================================
  # RIDES (implemented, except history / start / complete)
  # ===========================================================================
  /api/rides/estimate:
    post:
      tags: [Rides]
      operationId: estimateRide
      x-status: implemented
      x-required-role: PASSENGER
      summary: Estimate distance, duration and fare
      description: |
        **Auth:** Bearer JWT · **Role:** PASSENGER · **Rate limit:** 30 / minute per user.

        Calculates the road route (OSRM) and the fare for the chosen vehicle type. Use it to show the
        ride summary before booking. If the routing provider is unavailable, a straight-line estimate
        is returned with `routeSource: ESTIMATED`. `routeGeometry` is an encoded polyline for drawing
        the route on a map (null when estimated). Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RideRequest" }
            example:
              pickup: { address: "Boring Road, Patna", latitude: 25.6127, longitude: 85.1589 }
              destination: { address: "Patna Junction", latitude: 25.5941, longitude: 85.1376 }
              vehicleType: BIKE
      responses:
        "200":
          description: Estimate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideEstimateResponse" }
        "400":
          description: Validation failed, pickup and destination too close, or trip too long.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                tooClose: { value: { success: false, message: "Pickup and destination are too close (less than 100 m apart)." } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: The routing provider found no drivable route.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: No drivable route between pickup and destination. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/rides:
    post:
      tags: [Rides]
      operationId: bookRide
      x-status: implemented
      x-required-role: PASSENGER
      summary: Book a ride
      description: |
        **Auth:** Bearer JWT · **Role:** PASSENGER · **Rate limit:** 10 / minute per user.

        Recalculates route and fare on the server (any distance, duration or fare sent by the client
        is ignored), creates the ride in `SEARCHING`, and offers it to the nearest AVAILABLE,
        VERIFIED drivers with the requested vehicle type and a fresh location. One active ride per
        passenger. If nobody is available the ride stays `SEARCHING` and the message says so;
        searching continues when the ride is read, and stops after the search timeout (the ride is
        then cancelled by SYSTEM).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RideRequest" }
            example:
              pickup: { address: "Boring Road, Patna", latitude: 25.6127, longitude: 85.1589 }
              destination: { address: "Patna Junction", latitude: 25.5941, longitude: 85.1376 }
              vehicleType: BIKE
      responses:
        "201":
          description: Ride created and offered to nearby drivers (or no drivers available yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookRideResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The passenger already has an active ride.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: You already have an active ride. }
        "422":
          description: No drivable route.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/rides/current:
    get:
      tags: [Rides]
      operationId: getCurrentRide
      x-status: implemented
      x-required-role: PASSENGER, DRIVER
      summary: Get my active ride
      description: |
        **Auth:** Bearer JWT · **Role:** PASSENGER or DRIVER.

        Passenger: their ride that is not completed or cancelled (use after a refresh or reconnect).
        Driver: the ride currently assigned to them.
      responses:
        "200":
          description: Active ride.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No active ride.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: You have no active ride. }

  /api/rides/history:
    get:
      tags: [Rides]
      operationId: getRideHistory
      x-status: planned
      x-required-role: PASSENGER, DRIVER
      summary: "[PLANNED] My ride history"
      description: "**Planned.** **Auth:** Bearer JWT · **Role:** PASSENGER or DRIVER. Newest first."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RideStatus" }
      responses:
        "200":
          description: Rides.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/rides/{rideId}:
    parameters:
      - $ref: "#/components/parameters/RideId"
    get:
      tags: [Rides]
      operationId: getRide
      x-status: implemented
      x-required-role: PASSENGER, DRIVER, ADMIN
      summary: Get a ride
      description: |
        **Auth:** Bearer JWT · **Role:** the ride's passenger, a driver it is offered or assigned to,
        or ADMIN. Anyone else gets **404**.

        Includes the assigned driver's public details (name, photo, vehicle, plate). Never includes
        phone numbers, licence numbers or live location. Drivers and admins also see the passenger's
        name; admins also see matching details.
      responses:
        "200":
          description: Ride.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/rides/{rideId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RideId"
    patch:
      tags: [Rides]
      operationId: cancelRide
      x-status: implemented
      x-required-role: PASSENGER
      summary: Cancel my ride
      description: |
        **Auth:** Bearer JWT · **Role:** the ride's PASSENGER.

        Allowed while `SEARCHING` and after a driver is assigned, until the ride starts. An assigned
        driver goes back to AVAILABLE in the same transaction. No cancellation fee yet.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRideRequest" }
            example: { reason: Changed my plans }
      responses:
        "200":
          description: Ride cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already cancelled, completed or started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: This ride is already cancelled. }

  /api/drivers/rides/requests:
    get:
      tags: [Rides]
      operationId: listRideRequests
      x-status: implemented
      x-required-role: DRIVER
      summary: Ride requests offered to me
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER.

        Open ride offers for the caller (empty unless AVAILABLE), oldest first, each with the distance
        from the driver to the pickup. Socket.IO will push the same offers in real time later; this
        endpoint remains for catching up.
      responses:
        "200":
          description: Ride offers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideOfferListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/rides/{rideId}/accept:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Rides]
      operationId: acceptRide
      x-status: implemented
      x-required-role: DRIVER
      summary: Accept a ride offer
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER the ride was offered to (AVAILABLE, VERIFIED, matching
        vehicle type).

        In one transaction: the driver goes AVAILABLE → BUSY and the ride goes SEARCHING →
        DRIVER_ASSIGNED with `assignedAt`. Each step only succeeds if the state is still as expected,
        so if several drivers accept at once exactly one wins; the others get **409**.
      responses:
        "200":
          description: Ride accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Wrong role, driver not verified, or vehicle type mismatch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: "This ride needs a BIKE; your vehicle doesn't match." }
        "404":
          description: Ride doesn't exist or wasn't offered to this driver.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Ride request not found. }
        "409":
          description: Ride already taken, cancelled or expired; or driver not AVAILABLE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                taken: { value: { success: false, message: "This ride has already been accepted by another driver." } }
                busy: { value: { success: false, message: "You already have an active ride." } }

  /api/rides/{rideId}/reject:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Rides]
      operationId: rejectRide
      x-status: implemented
      x-required-role: DRIVER
      summary: Decline a ride offer
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER the ride was offered to.

        The ride stays SEARCHING and the driver stays AVAILABLE. When every offered driver has
        declined, the ride is offered to the next-nearest drivers.
      responses:
        "200":
          description: Offer declined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
              example: { success: true, message: Ride request declined. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/rides/{rideId}/start:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Rides]
      operationId: startRide
      x-status: planned
      x-required-role: DRIVER
      summary: "[PLANNED] Start the ride"
      description: "**Planned.** **Auth:** Bearer JWT · **Role:** the ride's assigned DRIVER. Moves the ride to `RIDE_STARTED` after pickup."
      responses:
        "200":
          description: Ride started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/rides/{rideId}/complete:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Rides]
      operationId: completeRide
      x-status: planned
      x-required-role: DRIVER
      summary: "[PLANNED] Complete the ride"
      description: "**Planned.** **Auth:** Bearer JWT · **Role:** the ride's assigned DRIVER. Moves the ride to `RIDE_COMPLETED` and sets the final fare."
      responses:
        "200":
          description: Ride completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ===========================================================================
  # RIDE MATCHING (planned)
  # ===========================================================================
  /api/rides/{rideId}/match:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Ride Matching]
      operationId: matchRide
      x-status: planned
      x-required-role: PASSENGER
      summary: "[PLANNED] (Re)start driver matching"
      description: |
        **Planned.** **Auth:** Bearer JWT · **Role:** the ride's PASSENGER.

        Searches for nearby AVAILABLE, VERIFIED drivers of the requested vehicle type and offers
        them the ride, e.g. to retry after `NO_DRIVERS_AVAILABLE`. The matching algorithm
        (radius, ranking, offer timeout) is not decided yet.
      responses:
        "202":
          description: Matching started; the result arrives via ride status / Socket.IO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/rides/{rideId}/driver:
    parameters:
      - $ref: "#/components/parameters/RideId"
    get:
      tags: [Ride Matching]
      operationId: getAssignedDriver
      x-status: planned
      x-required-role: PASSENGER
      summary: "[PLANNED] Get the assigned driver"
      description: |
        **Planned.** **Auth:** Bearer JWT · **Role:** the ride's PASSENGER.

        Public driver details for the passenger: name, photo, vehicle, and location while the
        driver is on the way. Never exposes documents or licence numbers.
      responses:
        "200":
          description: Assigned driver.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignedDriverResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

