  /api/rides/{rideId}/rating:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Ratings & Reviews]
      operationId: rateRide
      x-status: planned
      x-required-role: PASSENGER, DRIVER
      summary: "[PLANNED] Rate a completed ride"
      description: |
