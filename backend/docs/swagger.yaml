  # ===========================================================================
  # ADMIN: driver verification (implemented)
  # ===========================================================================
  /api/admin/drivers/pending-verification:
    get:
      tags: [Admin]
      operationId: listPendingDrivers
      x-status: implemented
      x-required-role: ADMIN
      summary: List drivers waiting for verification
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN.

        PENDING drivers, oldest first, with contact details, vehicle, documents and a `missing`
        list (`VEHICLE` and/or document types not yet submitted). Only drivers with an empty
        `missing` list can be verified.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pending drivers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingDriversResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/drivers/nearby:
    get:
      tags: [Admin]
      operationId: adminNearbyDrivers
      x-status: implemented
      x-required-role: ADMIN
      summary: Nearby available drivers (operations view)
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN.

        Runs the internal nearby-driver search used by the ride flow: AVAILABLE + VERIFIED drivers
        with a vehicle and a location updated within `LOCATION_STALE_AFTER_SECONDS`, nearest first.
        Not available to passengers or drivers.
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90, example: 25.5941 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180, example: 85.1376 } }
        - { name: radiusMeters, in: query, description: "Default NEARBY_SEARCH_RADIUS_METERS (5000).", schema: { type: integer, minimum: 100, maximum: 50000 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: vehicleType, in: query, schema: { $ref: "#/components/schemas/VehicleType" } }
      responses:
        "200":
          description: Drivers sorted by distance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Nearby available drivers fetched successfully. }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyDriver" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/drivers/{driverId}/verify:
    parameters:
      - $ref: "#/components/parameters/DriverId"
    patch:
      tags: [Admin]
      operationId: verifyDriver
      x-status: implemented
      x-required-role: ADMIN
      summary: Approve a driver
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN.

        Only a PENDING driver with a vehicle and both documents (AADHAAR and DRIVING_LICENSE) can be verified.
        Sets `verificationStatus: VERIFIED`, `verifiedAt`, `reviewedBy`, and marks all documents VERIFIED.
      responses:
        "200":
          description: Driver verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDriverProfileResponse" }
        "400":
          description: Invalid id, or submission incomplete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: "Driver can't be verified yet. Missing: VEHICLE, AADHAAR." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Driver is not PENDING (already verified/rejected) or was changed concurrently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Driver is already VERIFIED. }

  /api/admin/drivers/{driverId}/reject:
    parameters:
      - $ref: "#/components/parameters/DriverId"
    patch:
      tags: [Admin]
      operationId: rejectDriver
      x-status: implemented
      x-required-role: ADMIN
      summary: Reject a driver
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN.

        Sets `verificationStatus: REJECTED` with a reason. Optionally marks specific documents
        REJECTED (`documentTypes`) so the driver knows what to re-submit. Re-submitting a document
        moves the driver back to PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectDriverRequest" }
            example: { rejectionReason: Driving license image is unclear., documentTypes: [DRIVING_LICENSE] }
      responses:
        "200":
          description: Driver rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDriverProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

