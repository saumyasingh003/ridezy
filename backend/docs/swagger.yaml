                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Rating"
                            - type: object
                              properties:
                                from: { type: object, properties: { name: { type: string, example: Jiya } } }
                                ride:
                                  type: object
                                  nullable: true
                                  properties:
                                    pickup: { type: string }
                                    destination: { type: string }
                                    vehicleType: { $ref: "#/components/schemas/VehicleType" }
                                    completedAt: { type: string, format: date-time, nullable: true }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ===========================================================================
  # NOTIFICATIONS (planned)
  # ===========================================================================
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      x-status: implemented
      x-required-role: any
      summary: List my notifications
      description: |
        **Auth:** Bearer JWT · **Role:** any. Only the caller's own notifications, newest first.

        `unreadCount` (for the badge) always counts all unread, regardless of filters.
        `unreadOnly` must be exactly `true` or `false` (anything else → **400**).

        Created automatically by the backend (never by clients):
        | type | recipient | when |
        |---|---|---|
        | RIDE_ACCEPTED, DRIVER_ARRIVED, RIDE_STARTED, RIDE_COMPLETED | passenger | the driver moves the ride on |
        | DRIVER_APPROACHING | passenger | the assigned driver's live location comes within 500 m of the pickup (the ride moves `DRIVER_ASSIGNED` → `DRIVER_ARRIVING`) |
        | RIDE_NO_DRIVER | passenger | the search timed out |
        | PAYMENT_CONFIRMED | passenger | the driver confirmed a cash payment |
        | RIDE_CANCELLED | driver | the passenger cancelled after the driver accepted |
        | PAYMENT_RECEIVED | driver | an online payment succeeded |
        | NEW_RATING | driver | a rider rated the trip |
        | DRIVER_VERIFIED, DRIVER_REJECTED | driver | an admin reviewed the account |
        | DRIVER_READY_FOR_REVIEW | every admin | a PENDING driver has a vehicle and all documents |

        `data` holds ids for deep links (`rideId`, `paymentId`, `driverId`). Notifications are
        deleted automatically after 90 days.

        **No duplicates:** ride lifecycle notifications (the ride rows above) are unique per
        recipient, ride and type, enforced by a MongoDB unique index, so a retried or racing
        event never creates a second one.

        **Real time:** every new notification is also pushed over Socket.IO to the recipient's
        authenticated user room as `notification:new` `{ notification, unreadCount }`; marking
        read pushes `notification:unread-count` `{ unreadCount }` to all of the user's tabs.
        See `docs/realtime-events.md`. This endpoint is for the initial load and catching up.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: unreadOnly
          in: query
          schema: { type: string, enum: ["true", "false"], default: "false" }
      responses:
        "200":
          description: Notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      x-status: implemented
      x-required-role: any
      summary: My unread notification count (badge)
      description: |
        **Auth:** Bearer JWT · **Role:** any. Counts only the caller's own unread notifications.
        Live changes arrive over Socket.IO (`notification:new`, `notification:unread-count`).
      responses:
        "200":
          description: Unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Unread count fetched successfully. }
                  data: { type: object, properties: { unreadCount: { type: integer, example: 2 } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      x-status: implemented
      x-required-role: any
      summary: Mark all my notifications as read
      description: "**Auth:** Bearer JWT · **Role:** any. Only the caller's own; `data.updated` = how many were unread."
      responses:
        "200":
          description: All marked as read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: All notifications marked as read. }
                  data: { type: object, properties: { updated: { type: integer, example: 3 } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      x-status: implemented
      x-required-role: any
      summary: Mark a notification as read
      description: |
        **Auth:** Bearer JWT · **Role:** the notification's owner (anyone else → **404**).
        Idempotent: marking an already-read notification again keeps its original `readAt`.
      responses:
        "200":
          description: Marked as read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # ADMIN: driver verification (implemented)
  # ===========================================================================
  /api/admin/drivers/pending-verification:
    get:
      tags: [Admin]
      operationId: listPendingDrivers
      x-status: implemented
      x-required-role: ADMIN
      summary: List drivers waiting for verification
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN.

        PENDING drivers, oldest first, with contact details, vehicle, documents and a `missing`
        list (`VEHICLE` and/or document types not yet submitted). Only drivers with an empty
        `missing` list can be verified.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pending drivers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingDriversResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/drivers/nearby:
    get:
      tags: [Admin]
      operationId: adminNearbyDrivers
      x-status: implemented
      x-required-role: ADMIN
      summary: Nearby available drivers (operations view)
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN.

        Runs the internal nearby-driver search used by the ride flow: AVAILABLE + VERIFIED drivers
        with a vehicle and a location updated within `LOCATION_STALE_AFTER_SECONDS`, nearest first.
        Not available to passengers or drivers.
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90, example: 25.5941 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180, example: 85.1376 } }
        - { name: radiusMeters, in: query, description: "Default NEARBY_SEARCH_RADIUS_METERS (5000).", schema: { type: integer, minimum: 100, maximum: 50000 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: vehicleType, in: query, schema: { $ref: "#/components/schemas/VehicleType" } }
      responses:
        "200":
          description: Drivers sorted by distance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Nearby available drivers fetched successfully. }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyDriver" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/drivers/{driverId}/verify:
    parameters:
      - $ref: "#/components/parameters/DriverId"
    patch:
      tags: [Admin]
      operationId: verifyDriver
      x-status: implemented
      x-required-role: ADMIN
      summary: Approve a driver
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN.

        Only a PENDING driver with a vehicle and both documents (AADHAAR and DRIVING_LICENSE) can be verified.
        Sets `verificationStatus: VERIFIED`, `verifiedAt`, `reviewedBy`, and marks all documents VERIFIED.
      responses:
        "200":
          description: Driver verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDriverProfileResponse" }
        "400":
          description: Invalid id, or submission incomplete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: "Driver can't be verified yet. Missing: VEHICLE, AADHAAR." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Driver is not PENDING (already verified/rejected) or was changed concurrently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { success: false, message: Driver is already VERIFIED. }

  /api/admin/drivers/{driverId}/reject:
    parameters:
      - $ref: "#/components/parameters/DriverId"
    patch:
      tags: [Admin]
      operationId: rejectDriver
      x-status: implemented
      x-required-role: ADMIN
      summary: Reject a driver
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN.

        Sets `verificationStatus: REJECTED` with a reason. Optionally marks specific documents
        REJECTED (`documentTypes`) so the driver knows what to re-submit. Re-submitting a document
        moves the driver back to PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectDriverRequest" }
            example: { rejectionReason: Driving license image is unclear., documentTypes: [DRIVING_LICENSE] }
      responses:
        "200":
          description: Driver rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDriverProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ===========================================================================
  # ADMIN: management & analytics (planned)
  # ===========================================================================
  /api/admin/drivers:
    get:
      tags: [Admin]
      operationId: adminListDrivers
      x-status: implemented
      x-required-role: ADMIN
      summary: List all drivers
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN. Used by the admin **Drivers** page.

        Every user with the DRIVER role, newest first, with their profile status, vehicle,
        completed-trip count and rating (average of riders' ratings; null until rated).
        Filter by verification `status` (`ALL` = no filter) and `search` (name, email or phone).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { type: string, enum: [ALL, PENDING, VERIFIED, REJECTED], default: ALL }
        - name: search
          in: query
          description: Case-insensitive match on name, email or phone.
          schema: { type: string }
      responses:
        "200":
          description: Drivers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Drivers list fetched successfully. }
                  data:
                    type: object
                    properties:
                      drivers:
                        type: array
                        items: { $ref: "#/components/schemas/AdminDriverSummary" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/drivers/{driverId}:
    parameters:
      - $ref: "#/components/parameters/DriverId"
    get:
      tags: [Admin]
      operationId: adminGetDriver
      x-status: implemented
      x-required-role: ADMIN
      summary: Get a driver's full details
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN. Used by the admin **driver detail** page.

        `driverId` may be the DriverProfile id or the driver's User id. Returns the profile,
        contact details, vehicle, documents, rating, and the driver's 100 most recent assigned rides.
      responses:
        "200":
          description: Driver.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Driver details fetched successfully. }
                  data: { $ref: "#/components/schemas/AdminDriverDetails" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/drivers/{driverId}/suspend:
    parameters:
      - $ref: "#/components/parameters/DriverId"
    patch:
      tags: [Admin]
      operationId: suspendDriver
      x-required-role: ADMIN
      summary: "Suspend a driver"
      description: "**Auth:** Bearer JWT · **Role:** ADMIN. Suspends driver profile, sets availability status to OFFLINE, clears location, and logs an audit entry."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
            example: { reason: Multiple passenger safety complaints. }
      responses:
        "200":
          description: Driver suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDriverProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/drivers/{driverId}/activate:
    parameters:
      - $ref: "#/components/parameters/DriverId"
    patch:
      tags: [Admin]
      operationId: activateDriver
      x-required-role: ADMIN
      summary: "Re-activate a suspended driver"
      description: "**Auth:** Bearer JWT · **Role:** ADMIN. Restores suspended driver profile to VERIFIED status and logs an audit entry."
      responses:
        "200":
          description: Driver activated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDriverProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/rides:
    get:
      tags: [Admin]
      operationId: adminListRides
      x-required-role: ADMIN
      summary: "List all rides"
      description: "**Auth:** Bearer JWT · **Role:** ADMIN. Paginated listing of rides across the platform with optional status filter."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RideStatus" }
      responses:
        "200":
          description: Rides.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/rides/active:
    get:
      tags: [Admin]
      operationId: adminListActiveRides
      x-required-role: ADMIN
      summary: "List rides in progress"
      description: "**Auth:** Bearer JWT · **Role:** ADMIN. Paginated listing of active rides (REQUESTED, ACCEPTED, DRIVER_ARRIVED, IN_PROGRESS)."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Active rides.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/payments:
    get:
      tags: [Admin]
      operationId: adminListPayments
      x-required-role: ADMIN
      summary: "List all payments"
      description: |
        **Auth:** Bearer JWT · **Role:** ADMIN. Paginated listing of all platform payments with optional status filter.
        Each payment carries `baseFare`, `tipAmount` and `tipPaid` next to `amount` (the total charged).
        Totals include `paidFares` and `paidTips`; the 8% commission is taken on fares only, never on tips.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
      responses:
        "200":
          description: Payments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/analytics:
    get:
      tags: [Admin]
      operationId: adminAnalytics
      x-required-role: ADMIN
      summary: "Platform analytics"
      description: "**Auth:** Bearer JWT · **Role:** ADMIN. Aggregate counts of rides, drivers, passengers, and total platform revenue for a given date range."
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date, example: "2026-10-01" }
        - name: to
          in: query
          schema: { type: string, format: date, example: "2026-10-31" }
      responses:
        "200":
          description: Analytics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Analytics fetched successfully. }
                  data:
                    type: object
                    example: { totalRides: 1240, completedRides: 1102, activeDrivers: 86, totalRevenue: 184520, currency: INR }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/audit-logs:
    get:
      tags: [Admin]
      operationId: adminAuditLogs
      x-required-role: ADMIN
      summary: "Admin audit log"
      description: "**Auth:** Bearer JWT · **Role:** ADMIN. Record of admin actions (verifications, rejections, suspensions, activations)."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit log entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Audit logs fetched successfully. }
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items: { $ref: "#/components/schemas/AuditLog" }
                      pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ===========================================================================
  # HEALTH (implemented)
  # ===========================================================================
  /api/health:
    get:
      tags: [Health]
      operationId: health
      x-status: implemented
      x-required-role: none
      summary: Health check
      description: "**Auth:** none. 200 when the database answers, 503 otherwise. Used by the Docker healthcheck. Not wrapped in the standard envelope."
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: Database unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
              example: { status: degraded, timestamp: "2026-10-06T07:45:08.346Z", uptime: 12, services: { database: down } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT from `POST /api/auth/login`. Payload: `sub` = user id, `role` = PASSENGER | DRIVER | ADMIN."

  parameters:
    PlaceId:
      name: placeId
      in: path
      required: true
      description: Saved place id (from `savedPlaces[].id`).
      schema: { $ref: "#/components/schemas/ObjectId" }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Document id (from `GET /api/drivers/documents`).
      schema: { $ref: "#/components/schemas/ObjectId" }
    DriverId:
      name: driverId
      in: path
      required: true
      description: Driver **profile** id (`DriverProfile.id`), not the user id.
      schema: { $ref: "#/components/schemas/ObjectId" }
    RideId:
      name: rideId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ObjectId" }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ObjectId" }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ObjectId" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Request body, query or path parameter failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
    Unauthorized:
      description: Missing, invalid or expired JWT.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            missing: { value: { success: false, message: Authentication required. } }
            invalid: { value: { success: false, message: Invalid or expired token. } }
    Forbidden:
      description: Authenticated, but the role is not allowed to use this endpoint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { success: false, message: You do not have permission to perform this action. }
    NotFound:
      description: The resource doesn't exist, or doesn't belong to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { success: false, message: Driver profile not found. Create one first. }
    Conflict:
      description: Conflicts with existing data (duplicate value or invalid state).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { success: false, message: A record with these details already exists. }
    TooManyRequests:
      description: Rate limit exceeded. See the `RateLimit` / `RateLimit-Policy` response headers.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { success: false, message: Too many requests. Please try again later. }

  schemas:
    # ---------------------------------------------------------------- common
    ObjectId:
      type: string
      pattern: "^[a-f0-9]{24}$"
      example: 6ac49c10dc4a882c54446f3f
    Phone:
      type: string
      description: E.164. A 10-digit Indian mobile is accepted on input and stored with +91.
      example: "+919876543210"
    Timestamps:
      type: object
      properties:
        createdAt: { type: string, format: date-time, example: "2026-10-06T07:45:08.346Z" }
        updatedAt: { type: string, format: date-time, example: "2026-10-06T07:45:08.346Z" }
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Operation completed successfully. }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Driver profile not found. }
        stack:
          type: string
          description: Only for 5xx errors in development; never in production.
    ValidationErrorResponse:
      type: object
      required: [success, message, errors]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Validation failed. }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: phone }
              message: { type: string, example: "Enter a valid phone number, e.g. 9876543210 or +919876543210" }
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        pages: { type: integer, example: 3 }
    Money:
      type: object
      properties:
        amount: { type: number, example: 89 }
        currency: { type: string, example: INR }
    # ---------------------------------------------------------------- enums
    Role:
      type: string
      enum: [PASSENGER, DRIVER, ADMIN]
    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
    VehicleType:
      type: string
      enum: [BIKE, AUTO, CAB]
    DriverAvailability:
      type: string
      enum: [OFFLINE, AVAILABLE, BUSY]
      description: "Stored on DriverProfile (default OFFLINE). Drivers set AVAILABLE/OFFLINE; BUSY is set by the ride flow."
    DocumentType:
      type: string
      description: Documents a driver must submit. AADHAAR number = 12 digits (not starting with 0 or 1); DRIVING_LICENSE number = 8-20 letters/digits.
      enum: [AADHAAR, DRIVING_LICENSE]
    SavedPlaceType:
      type: string
      enum: [HOME, WORK, OTHER]
    RideStatus:
      type: string
      description: |
        SEARCHING → DRIVER_ASSIGNED → DRIVER_ARRIVING → DRIVER_ARRIVED → RIDE_STARTED → RIDE_COMPLETED;
        CANCELLED from any state before RIDE_STARTED. Only defined transitions are allowed.
        Currently used: SEARCHING, DRIVER_ASSIGNED, CANCELLED.
      enum: [SEARCHING, DRIVER_ASSIGNED, DRIVER_ARRIVING, DRIVER_ARRIVED, RIDE_STARTED, RIDE_COMPLETED, CANCELLED]
    PaymentMethod:
      type: string
      enum: [CASH, UPI, CARD]
    PaymentStatus:
      type: string
      description: REFUNDED is reserved for refunds (not implemented yet).
      enum: [PENDING, COMPLETED, FAILED, REFUNDED]

    # ------------------------------------------------------------ auth (implemented)
    User:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        name: { type: string, example: Saumya Singh }
        email: { type: string, format: email, example: saumya@example.com }
        phone:
          type: string
          allOf: [{ $ref: "#/components/schemas/Phone" }]
          nullable: true
        role: { $ref: "#/components/schemas/Role" }
        isEmailVerified: { type: boolean, example: true }
    RegisterRequest:
      type: object
      required: [name, email, phone, password, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 50, example: Saumya Singh }
        email: { type: string, format: email, maxLength: 254, example: saumya@example.com }
        phone: { type: string, example: "9876543210" }
        password:
          type: string
          format: password
          minLength: 8
          description: 8–72 bytes, at least one uppercase letter, one lowercase letter and one digit.
          example: StrongPassword123
        role:
          type: string
          enum: [PASSENGER, DRIVER]
          description: ADMIN is rejected.
    VerifyEmailRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email, example: saumya@example.com }
        otp: { type: string, pattern: "^\\d{6}$", example: "482913" }
    EmailRequest:
      type: object
      required: [email]
      properties:
