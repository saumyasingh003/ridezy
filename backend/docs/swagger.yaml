            rideId: { $ref: "#/components/schemas/ObjectId" }
            passengerId: { $ref: "#/components/schemas/ObjectId" }
            driverId: { $ref: "#/components/schemas/ObjectId" }
            amount: { $ref: "#/components/schemas/Money" }
