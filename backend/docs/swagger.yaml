    get:
      tags: [Payments]
      operationId: getPaymentHistory
      x-status: planned
      x-required-role: PASSENGER, DRIVER
      summary: "[PLANNED] My payment history"
      description: "**Planned.** **Auth:** Bearer JWT · **Role:** PASSENGER (payments made) or DRIVER (payments received)."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Payments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/rides/{rideId}/payment:
