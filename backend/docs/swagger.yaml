        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        make: { type: string, maxLength: 50, example: Honda }
        model: { type: string, maxLength: 50, example: Shine }
        year: { type: integer, minimum: 1990, description: Up to next calendar year., example: 2024 }
        color: { type: string, minLength: 2, maxLength: 30, example: Black }
        registrationNumber: { type: string, minLength: 4, maxLength: 12, description: Normalised and unique., example: BR01AB1234 }
        vehicleImage: { type: string, format: uri, nullable: true }
    VehicleUpdate:
      type: object
      minProperties: 1
      description: Any subset of VehicleInput fields; at least one.
      properties:
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        make: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 50 }
        year: { type: integer, minimum: 1990 }
        color: { type: string, minLength: 2, maxLength: 30, example: Red }
        registrationNumber: { type: string, minLength: 4, maxLength: 12 }
        vehicleImage: { type: string, format: uri, nullable: true }
    Vehicle:
      allOf:
        - type: object
          properties:
            id: { $ref: "#/components/schemas/ObjectId" }
            driverId:
              allOf: [{ $ref: "#/components/schemas/ObjectId" }]
              description: DriverProfile id.
            vehicleType: { $ref: "#/components/schemas/VehicleType" }
            make: { type: string, example: Honda }
            model: { type: string, example: Shine }
            year: { type: integer, example: 2024 }
            color: { type: string, example: Black }
            registrationNumber: { type: string, example: BR01AB1234 }
            vehicleImage: { type: string, format: uri }
        - $ref: "#/components/schemas/Timestamps"
    VehicleResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Vehicle fetched successfully. }
        data: { $ref: "#/components/schemas/Vehicle" }

    # ------------------------------------------------ driver documents (implemented)
    DriverDocumentInput:
      type: object
      required: [documentType, documentNumber, documentUrl]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, description: "Format depends on documentType (see DocumentType).", example: "234123412341" }
        documentUrl: { type: string, format: uri, maxLength: 2048, example: "https://files.example.com/aadhaar.jpg" }
    DriverDocumentUpdate:
      type: object
      minProperties: 1
      properties:
        documentNumber: { type: string, minLength: 4, maxLength: 30 }
        documentUrl: { type: string, format: uri, maxLength: 2048, example: "https://files.example.com/driving-license-clear.jpg" }
    DriverDocument:
      allOf:
        - type: object
          properties:
            id: { $ref: "#/components/schemas/ObjectId" }
            driverId:
              allOf: [{ $ref: "#/components/schemas/ObjectId" }]
              description: DriverProfile id.
            documentType: { $ref: "#/components/schemas/DocumentType" }
            documentNumber: { type: string, example: BR0120230001234 }
            documentUrl: { type: string, format: uri, example: "https://files.example.com/driving-license.jpg" }
            verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
            rejectionReason: { type: string }
            verifiedAt: { type: string, format: date-time }
        - $ref: "#/components/schemas/Timestamps"
    DriverDocumentResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Document submitted for verification. }
        data: { $ref: "#/components/schemas/DriverDocument" }
    DriverDocumentListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Documents fetched successfully. }
        data:
          type: array
          items: { $ref: "#/components/schemas/DriverDocument" }

    # ----------------------------------------------------------------- health
    HealthReport:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded], example: ok }
        timestamp: { type: string, format: date-time, example: "2026-10-06T07:45:08.346Z" }
        uptime: { type: integer, description: Seconds since process start., example: 3600 }
        services:
          type: object
          properties:
            database: { type: string, enum: [up, down], example: up }

    AvailabilityRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [AVAILABLE, OFFLINE]
          description: BUSY is set by the ride flow, never by the driver.
    DriverLocationInput:
      type: object
      required: [latitude, longitude]
      description: Both fields are required. Stored as GeoJSON [longitude, latitude].
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, example: 25.5941 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 85.1376 }
    DriverLocation:
      type: object
      properties:
        availabilityStatus: { $ref: "#/components/schemas/DriverAvailability" }
        latitude: { type: number, nullable: true, example: 25.5941 }
        longitude: { type: number, nullable: true, example: 85.1376 }
        lastLocationUpdatedAt: { type: string, format: date-time, nullable: true, example: "2026-10-06T09:30:00.000Z" }
        isLocationStale: { type: boolean, example: false }
    DriverLocationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Location updated successfully. }
        data: { $ref: "#/components/schemas/DriverLocation" }
    NearbyDriver:
      type: object
      description: Internal search result (admin view). Never returned to passengers.
      properties:
        driverId:
          allOf: [{ $ref: "#/components/schemas/ObjectId" }]
          description: DriverProfile id.
        userId: { $ref: "#/components/schemas/ObjectId" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        distanceMeters: { type: number, example: 1001 }
        latitude: { type: number, example: 25.6031 }
        longitude: { type: number, example: 85.1376 }
        lastLocationUpdatedAt: { type: string, format: date-time }

    # ------------------------------------------------------------ rides (implemented)
    Place:
      type: object
      required: [address, latitude, longitude]
      properties:
        address: { type: string, minLength: 3, maxLength: 300, example: "Boring Road, Patna" }
        latitude: { type: number, minimum: -90, maximum: 90, example: 25.6127 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 85.1589 }
    RideRequest:
      type: object
      required: [pickup, destination, vehicleType]
      description: Only these fields are read. Distance, duration and fare are always calculated by the server.
      properties:
        pickup: { $ref: "#/components/schemas/Place" }
        destination: { $ref: "#/components/schemas/Place" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
    RideEstimate:
      type: object
      properties:
        pickup: { $ref: "#/components/schemas/Place" }
        destination: { $ref: "#/components/schemas/Place" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        distanceKm: { type: number, example: 4.7 }
        durationMinutes: { type: integer, example: 6 }
        estimatedFare: { type: number, description: Whole rupees., example: 58 }
        currency: { type: string, example: INR }
        fareBreakdown:
          type: object
          properties:
            baseFare: { type: number, example: 20 }
            distanceFare: { type: number, example: 38 }
            minimumFare: { type: number, example: 30 }
        routeSource: { type: string, enum: [OSRM, ESTIMATED], example: OSRM }
        routeGeometry: { type: string, nullable: true, description: Encoded polyline (precision 5)., example: "ekeyCeqygO..." }
    RideEstimateResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Ride estimate calculated successfully. }
        data: { $ref: "#/components/schemas/RideEstimate" }
    AssignedDriver:
      type: object
      description: Public driver details only. No phone, licence, documents or live location.
      properties:
        name: { type: string, example: Ravi Kumar }
        profileImage: { type: string, format: uri, nullable: true }
        rating: { type: number, nullable: true, description: "Average of passengers' ratings (1 decimal); null until rated.", example: 4.8 }
        ratingCount: { type: integer, example: 12 }
        vehicle:
          type: object
          nullable: true
          properties:
            vehicleType: { $ref: "#/components/schemas/VehicleType" }
            make: { type: string, example: Honda }
            model: { type: string, example: Shine }
            color: { type: string, example: Black }
            registrationNumber: { type: string, example: BR01AB1234 }
    Ride:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        status: { $ref: "#/components/schemas/RideStatus" }
        pickup: { $ref: "#/components/schemas/Place" }
        destination: { $ref: "#/components/schemas/Place" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        distanceKm: { type: number, example: 4.7 }
        estimatedDurationMinutes: { type: integer, example: 6 }
        estimatedFare: { type: number, example: 58 }
        currency: { type: string, example: INR }
        routeSource: { type: string, enum: [OSRM, ESTIMATED] }
        assignedAt: { type: string, format: date-time, nullable: true }
        arrivedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        finalFare: { type: number, nullable: true, example: 58, description: Set on completion (= estimatedFare). }
        tipAmount:
          type: integer
          enum: [0, 20, 40, 50, 60]
          example: 40
          description: Tip the passenger offered (PATCH /rides/{rideId}/tip). Shown to drivers in offers; the payment's default tip.
        myRating:
          type: integer
          nullable: true
          description: Only on RIDE_COMPLETED rides, only for the PASSENGER. The score they gave; null = not rated yet.
          example: 5
        payment:
          type: object
          nullable: true
          description: Only on RIDE_COMPLETED rides. The open (PENDING/COMPLETED) payment, or null if unpaid.
          properties:
            id: { $ref: "#/components/schemas/ObjectId" }
            status: { $ref: "#/components/schemas/PaymentStatus" }
            method: { $ref: "#/components/schemas/PaymentMethod" }
            amount: { type: number, example: 98, description: Final total (fare + tip + ...). }
            tipAmount: { type: integer, enum: [0, 20, 40, 50, 60], example: 40 }
            tipPaid: { type: boolean, example: true }
            breakdown:
              type: object
              properties:
                baseFare: { type: number, example: 58 }
                tip: { type: number, example: 40 }
                taxes: { type: number, example: 0 }
                additionalCharges: { type: number, example: 0 }
                discount: { type: number, example: 0 }
                total: { type: number, example: 98 }
        startOtp:
          type: string
          example: "4821"
          description: Only for the PASSENGER, from DRIVER_ASSIGNED until the ride starts. Read it out to the driver.
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledBy: { type: string, enum: [PASSENGER, DRIVER, SYSTEM], nullable: true }
        cancellationReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        driver:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AssignedDriver" }]
        passenger:
          type: object
          description: Only for DRIVER and ADMIN viewers.
          properties:
            name: { type: string, example: Saumya Singh }
        matching:
          type: object
          description: Only for ADMIN viewers.
          properties:
            offeredDriverIds: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
            rejectedDriverIds: { type: array, items: { $ref: "#/components/schemas/ObjectId" } }
            matchingAttempts: { type: integer, example: 1 }
    RideResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Ride fetched successfully. }
        data: { $ref: "#/components/schemas/Ride" }
    BookRideResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message:
          type: string
          description: '"Ride booked. Looking for a driver." or "No drivers are currently available. We''ll keep searching."'
          example: Ride booked. Looking for a driver.
        data:
          allOf:
            - $ref: "#/components/schemas/Ride"
            - type: object
              properties:
                driversContacted: { type: integer, description: How many drivers the ride was offered to., example: 3 }
    RideOffer:
      allOf:
        - $ref: "#/components/schemas/Ride"
        - type: object
          properties:
            distanceToPickupKm: { type: number, nullable: true, example: 1.2 }
    RideOfferListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Ride requests fetched successfully. }
        data:
          type: array
          items: { $ref: "#/components/schemas/RideOffer" }
    RideListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Rides fetched successfully. }
        data:
          type: object
          properties:
            rides:
              type: array
              items: { $ref: "#/components/schemas/Ride" }
            pagination: { $ref: "#/components/schemas/Pagination" }
    CancelRideRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 300, example: Changed my plans }

    # ===================================================================
    # PLANNED schemas: proposed contracts, subject to change
    # ===================================================================
    AssignedDriverResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Driver fetched successfully. }
        data:
          type: object
          description: Public driver details only. No phone, licence number or documents.
          properties:
            rideId: { $ref: "#/components/schemas/ObjectId" }
            rideStatus: { $ref: "#/components/schemas/RideStatus" }
            name: { type: string, example: Ravi Kumar }
            profileImage: { type: string, format: uri, nullable: true }
            rating: { type: number, nullable: true, example: null }
            vehicle:
              type: object
              nullable: true
              properties:
                vehicleType: { $ref: "#/components/schemas/VehicleType" }
                make: { type: string, example: Honda }
                model: { type: string, example: Shine }
                color: { type: string, example: Black }
                registrationNumber: { type: string, example: BR01AB1234 }
            location:
              type: object
              nullable: true
              description: Only while the ride is active (DRIVER_ASSIGNED → RIDE_STARTED); null otherwise.
              properties:
                latitude: { type: number, example: 25.6127 }
                longitude: { type: number, example: 85.1589 }
                lastLocationUpdatedAt: { type: string, format: date-time, nullable: true }
                isLocationStale: { type: boolean, example: false }
                heading: { type: string, enum: [PICKUP, DESTINATION], description: "PICKUP before the ride starts, DESTINATION during it." }
                distanceKm: { type: number, example: 1.4, description: Estimated road distance to where the driver is heading. }
                etaMinutes: { type: integer, example: 4, description: Rough estimate (city average speed). }
    Payment:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        rideId: { $ref: "#/components/schemas/ObjectId" }
        amount:
          type: number
          example: 111
          description: Final total charged and recorded (= breakdown.total).
        tipAmount: { type: integer, enum: [0, 20, 40, 50, 60], example: 40, description: Driver tip (₹), kept apart from the fare. }
        tipPaid: { type: boolean, example: true, description: True only when a tip was given and the payment is COMPLETED. }
        breakdown:
          type: object
          description: "Final Amount = baseFare + tip + taxes + additionalCharges - discount. Clients may hide zero lines."
          properties:
            baseFare: { type: number, example: 71 }
            tip: { type: number, example: 40 }
            taxes: { type: number, example: 0 }
            additionalCharges: { type: number, example: 0 }
            discount: { type: number, example: 0 }
            total: { type: number, example: 111 }
        currency: { type: string, example: INR }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        provider: { type: string, enum: [CASH, MOCK, RAZORPAY], description: "CASH, or the gateway that charged it." }
        providerPaymentId: { type: string, nullable: true, example: mock_pay_3f0c2a9e }
        failureReason: { type: string, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        ride:
          type: object
          nullable: true
          properties:
            pickup: { type: string, example: Boring Road, Patna }
            destination: { type: string, example: Patna Junction }
            vehicleType: { $ref: "#/components/schemas/VehicleType" }
            distanceKm: { type: number, example: 4.7 }
            completedAt: { type: string, format: date-time, nullable: true }
        passenger:
          type: object
          description: Only for DRIVER and ADMIN viewers.
          properties:
            name: { type: string, example: Jiya }
        driver:
          type: object
          description: Only for the PASSENGER viewer.
          properties:
            name: { type: string, example: Sunena Singh }
        myRating:
          type: object
          nullable: true
          description: Only for the PASSENGER viewer. Their rating of this ride's driver, or null if not rated yet.
          properties:
            score: { type: integer, minimum: 1, maximum: 5, example: 4 }
            comment: { type: string, nullable: true, example: Smooth ride }
        canRate:
          type: boolean
          description: |
            Only for the PASSENGER viewer. True when the payment is COMPLETED and the passenger hasn't
            rated the driver yet; clients show the rating prompt (POST /api/rides/{rideId}/rating).
          example: true
    PaymentResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Payment successful. }
        data: { $ref: "#/components/schemas/Payment" }
    PaymentListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Payments fetched successfully. }
        data:
          type: object
          properties:
            payments:
              type: array
              items: { $ref: "#/components/schemas/Payment" }
            summary:
              type: object
              properties:
                currency: { type: string, example: INR }
                paidAmount: { type: number, example: 253, description: Total of COMPLETED payments (fares + tips). }
                paidCount: { type: integer, example: 3 }
                paidFares: { type: number, example: 213, description: Fare part of paidAmount (tips excluded). }
                paidTips: { type: number, example: 40, description: Tip part of paidAmount (all to the driver). }
                pendingAmount: { type: number, example: 71 }
                pendingCount: { type: integer, example: 1 }
            pagination: { $ref: "#/components/schemas/Pagination" }
    RatingInput:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string, maxLength: 500, example: Smooth ride and polite driver. }
    Rating:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        rideId: { $ref: "#/components/schemas/ObjectId" }
        fromRole: { type: string, enum: [PASSENGER, DRIVER], description: "Who gave it: PASSENGER rated the driver, DRIVER rated the passenger." }
        score: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string, nullable: true, example: Smooth ride and polite driver. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RatingResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Rating submitted successfully. }
        data: { $ref: "#/components/schemas/Rating" }
    Notification:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        recipientId: { $ref: "#/components/schemas/ObjectId" }
        rideId:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{24}$"
          description: The ride this is about; null for account notifications (e.g. DRIVER_VERIFIED).
        type:
          type: string
          enum:
            [RIDE_ACCEPTED, DRIVER_APPROACHING, DRIVER_ARRIVED, RIDE_STARTED, RIDE_COMPLETED, RIDE_NO_DRIVER,
             PAYMENT_CONFIRMED, RIDE_CANCELLED, PAYMENT_RECEIVED, NEW_RATING, DRIVER_VERIFIED, DRIVER_REJECTED,
             DRIVER_READY_FOR_REVIEW]
          example: RIDE_ACCEPTED
        title: { type: string, example: Driver on the way }
        message: { type: string, example: Bikki accepted your ride and is heading to your pickup. }
        body: { type: string, description: Same as `message` (kept for existing clients)., example: Bikki accepted your ride and is heading to your pickup. }
        data:
          type: object
          additionalProperties: { type: string }
          description: Ids for deep links, e.g. rideId, paymentId, driverId.
          example: { rideId: 6ac9eb0f484c3993652b5b04 }
        isRead: { type: boolean, example: false }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Notification marked as read. }
        data: { $ref: "#/components/schemas/Notification" }
    NotificationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Notifications fetched successfully. }
        data:
          type: object
          properties:
            notifications:
              type: array
              items: { $ref: "#/components/schemas/Notification" }
            unreadCount: { type: integer, example: 2 }
            pagination: { $ref: "#/components/schemas/Pagination" }
    AuditLog:
      type: object
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        adminId: { $ref: "#/components/schemas/ObjectId" }
        action: { type: string, example: DRIVER_VERIFIED }
        targetType: { type: string, example: DriverProfile }
        targetId: { $ref: "#/components/schemas/ObjectId" }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------ ride communication
    RideMessage:
      type: object
      description: Plain text. Clients must render `body` as text, never as HTML.
      properties:
        id: { $ref: "#/components/schemas/ObjectId" }
        rideId: { $ref: "#/components/schemas/ObjectId" }
        senderId: { $ref: "#/components/schemas/ObjectId" }
        senderRole: { type: string, enum: [PASSENGER, DRIVER] }
        body: { type: string, minLength: 1, maxLength: 1000, example: "I'm at the main gate" }
        clientMessageId:
          type: string
          nullable: true
          description: Client-generated id sent with `chat:send`; a resend with the same id returns the same message.
          example: m-1739-a1
        createdAt: { type: string, format: date-time }
    RideMessageListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Messages fetched successfully. }
        data:
          type: object
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/RideMessage" }
            hasMore: { type: boolean, example: true }
            nextCursor:
              type: string
              nullable: true
              pattern: "^[a-f0-9]{24}$"
              description: Pass as `before` to load the previous (older) page. Null when there are no older messages.
    CallView:
      type: object
      description: |
        An in-app call. `RINGING` → `CONNECTING` (answered, WebRTC handshake running) → `ACTIVE`
        (a browser reported its peer connection is connected, so audio is flowing).
      properties:
        callId: { type: string, format: uuid }
        rideId: { $ref: "#/components/schemas/ObjectId" }
        state: { type: string, enum: [RINGING, CONNECTING, ACTIVE] }
        direction: { type: string, enum: [OUTGOING, INCOMING], description: Relative to whoever is asking. }
        caller:
          type: object
          properties:
            role: { type: string, enum: [PASSENGER, DRIVER] }
            name: { type: string, example: Ravi Kumar }
        callee:
          type: object
          properties:
            role: { type: string, enum: [PASSENGER, DRIVER] }
            name: { type: string, example: Asha Singh }
        createdAt: { type: string, format: date-time }
        connectedAt: { type: string, format: date-time, nullable: true }
    IceServer:
      type: object
      description: An RTCIceServer, passed as-is to `new RTCPeerConnection({ iceServers })`.
      properties:
        urls:
          oneOf:
            - { type: string, example: "stun:stun.l.google.com:19302" }
            - { type: array, items: { type: string } }
        username: { type: string }
        credential: { type: string }
    CommunicationStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Communication status fetched successfully. }
        data:
          type: object
          properties:
            rideId: { $ref: "#/components/schemas/ObjectId" }
            rideStatus: { $ref: "#/components/schemas/RideStatus" }
            canChat: { type: boolean, example: true }
            canCall: { type: boolean, example: true }
            closedReason:
              type: string
              nullable: true
              enum: [WAITING_FOR_DRIVER, RIDE_COMPLETED, RIDE_CANCELLED]
              description: Why chat/calls are closed; null while open.
              example: null
            you:
              type: object
              properties:
                role: { type: string, enum: [PASSENGER, DRIVER] }
            counterpart:
              type: object
              nullable: true
              description: The other participant. Null while no driver is assigned.
              properties:
                role: { type: string, enum: [PASSENGER, DRIVER] }
                name: { type: string, example: Ravi Kumar }
                phone:
                  type: string
                  nullable: true
                  example: "+919876543210"
                  description: |
                    E.164 phone number so the two can call each other. Only revealed to the ride's
                    passenger and current driver **while the ride is active**; null after it ends,
                    or if the user hasn't added a phone number.
                online: { type: boolean, description: Has at least one connected socket, so can receive a call. }
            activeCall:
              type: object
              nullable: true
              description: The ride's ongoing call (a CallView), or null.
              allOf: [{ $ref: "#/components/schemas/CallView" }]
            limits:
              type: object
              properties:
                maxMessageLength: { type: integer, example: 1000 }
            rtc:
              type: object
              properties:
                iceServers:
                  type: array
                  items: { $ref: "#/components/schemas/IceServer" }
                ringTimeoutSeconds: { type: integer, example: 30 }
