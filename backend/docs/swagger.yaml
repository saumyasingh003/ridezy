        **Auth:** Bearer JWT · **Role:** the ride's PASSENGER or its **currently** assigned DRIVER.

        Newest page first; messages **within** a page are oldest → newest (ready to render).
        To load older messages pass `before=<nextCursor>` from the previous page. Cursors don't
        shift when new messages arrive, unlike page numbers.

        History stays readable after the ride ends (read-only). New messages are **sent over
        Socket.IO** (`chat:send`), not REST.

        Someone else's ride, or a previously assigned driver → **404**.
      parameters:
        - name: before
          in: query
          description: Return messages older than this message id (`nextCursor` of the previous page).
          schema: { $ref: "#/components/schemas/ObjectId" }
