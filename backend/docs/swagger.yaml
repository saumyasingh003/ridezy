          description: Communication status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationStatusResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
