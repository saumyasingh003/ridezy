  /api/ratings/me:
    get:
      tags: [Ratings & Reviews]
      operationId: getMyRatings
      x-status: implemented
      x-required-role: DRIVER
      summary: Ratings I received
      description: |
        **Auth:** Bearer JWT · **Role:** DRIVER. Riders and admins get **403**.

        The ratings riders gave the calling driver, newest first (ties broken by id, so pages never
        overlap), paginated, with an optional `score` filter (whole number 1-5).

        `summary` always covers **all** of the driver's ratings, whatever the page or `score` filter:
        average (1 decimal, null if none), count, and a 1-5 breakdown. It is the same number shown as
