  # ===========================================================================
  # PAYMENTS (planned)
  # ===========================================================================
  /api/payments/history:
    get:
      tags: [Payments]
      operationId: getPaymentHistory
      x-status: implemented
      x-required-role: PASSENGER, DRIVER
      summary: My payment history
      description: |
        **Auth:** Bearer JWT · **Role:** PASSENGER (payments made) or DRIVER (payments received).

        Newest first, paginated, optional `status` filter. `summary` totals cover all pages:
        `paidAmount` (COMPLETED) and `pendingAmount` (cash awaiting the driver's confirmation).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
      responses:
        "200":
          description: Payments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/rides/{rideId}/payment:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Payments]
      operationId: payForRide
      x-status: implemented
      x-required-role: PASSENGER
      summary: Pay for a completed ride
      description: |
        **Auth:** Bearer JWT · **Role:** the ride's PASSENGER.

        Only for a `RIDE_COMPLETED` ride. The total is computed on the server (any `amount` sent is
        ignored):

        **Final Amount = Base Fare + Tip + Taxes + Additional Charges − Discounts**

        Base fare = the ride's finalized `finalFare`. `tip` is optional: one of `0, 20, 40, 50, 60` (₹,
        default 0; anything else → **400**). Fares are tax-inclusive and there are no extra charges or
        discounts yet, so those are 0. The gateway is charged exactly `amount`, and the same value is
        stored and shown (`breakdown.total`). The tip goes entirely to the driver and is recorded
        separately (`tipAmount`).

        Pending CASH (created automatically when the ride completes, with no tip): sending CASH with a
        different tip updates that pending payment's tip and total. Once a payment is COMPLETED the
        tip can't change (**409**). `tipPaid` is true only when the payment is COMPLETED.
        - **UPI / CARD with Razorpay** (`PAYMENT_PROVIDER=razorpay`): creates a Razorpay order for the
          exact total and returns the payment `PENDING` (**201**) with `data.checkout`
          (`keyId`, `orderId`, `amount` in paise, `currency`, `prefill`, ...). Open Razorpay Checkout with
          it, then send its result to `POST /api/payments/{id}/razorpay/verify`. Calling again with the same
          method and tip returns the same order (**200**); a different tip starts a new order.
        - **UPI / CARD with the simulated gateway** (`PAYMENT_PROVIDER=mock`): charged instantly →
          `COMPLETED` (**201**). A declined charge is stored as `FAILED` and returns **402**; the
          passenger can try again.
        - **CASH:** `PENDING` (**201**) until the driver calls `POST /api/payments/{id}/confirm-cash`.
          Sending CASH again returns the same payment (**200**). Choosing UPI/CARD while cash is
          pending closes the cash attempt (`FAILED`, "Switched to …").

        A ride can't be paid twice: already paid → **409** (also enforced by a unique index, so two
        simultaneous payments can't both succeed). Not completed → **409**. Someone else's ride → **404**.

        Once a payment is `COMPLETED` the passenger is **emailed a receipt** (in the background; a mail
        failure never affects the payment), with a "rate your ride" link if they haven't rated yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: "#/components/schemas/PaymentMethod" }
                tip:
                  type: integer
                  enum: [0, 20, 40, 50, 60]
                  description: Optional driver tip in ₹, added once to the total. Omitted = the tip offered on the ride (`tipAmount`, 0 if none).
            example: { method: UPI, tip: 40 }
      responses:
        "201":
          description: Payment created (COMPLETED for UPI/CARD, PENDING for CASH).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "200":
          description: The existing pending CASH payment (idempotent).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: The gateway declined the charge (stored as FAILED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/payments/{paymentId}/razorpay/verify:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [Payments]
      operationId: verifyRazorpayPayment
      x-status: implemented
      x-required-role: PASSENGER
      summary: Confirm a Razorpay Checkout payment
      description: |
        **Auth:** Bearer JWT · **Role:** the payment's PASSENGER.

        Send exactly what Razorpay Checkout's `handler` returns. The server:
        1. checks the order belongs to this PENDING payment,
        2. verifies `razorpay_signature` = HMAC-SHA256(`order_id|payment_id`, key secret),
        3. fetches the payment from Razorpay and checks order, **exact amount** (fare + tip, in
           paise), currency and that it is captured (an authorized payment is captured here),
        4. marks the payment COMPLETED (then the receipt email and driver notification).

        Idempotent: if the webhook already completed it with the same Razorpay payment id → **200**.
        Bad signature / wrong order / wrong amount → **400** (stays PENDING). Not captured → **402**.
        Someone else's payment → **404**. No longer pending (method switched, tip changed) → **409**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
              properties:
                razorpay_order_id: { type: string, example: order_PZ0V3xgk0nW5a1 }
                razorpay_payment_id: { type: string, example: pay_PZ0VBCm9Zx1k2Q }
                razorpay_signature: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Paid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: Razorpay reports the payment as not completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/payments/razorpay/webhook:
    post:
      tags: [Payments]
      operationId: razorpayWebhook
      x-status: implemented
      x-required-role: none (Razorpay servers)
      summary: Razorpay webhook
      description: |
        **Auth:** none (no JWT); authenticated by the `X-Razorpay-Signature` header =
        HMAC-SHA256(raw request body, `RAZORPAY_WEBHOOK_SECRET`). Configure it in the Razorpay
        Dashboard → Account & Settings → Webhooks with the URL
        `https://<public backend>/api/payments/razorpay/webhook`, the same secret, and the events
        **payment.captured**, **payment.failed** and **order.paid**.

        - `payment.captured` / `order.paid` → same checks as verify, then COMPLETED (idempotent).
        - `payment.failed` → the reason is noted; the payment stays PENDING (Checkout allows retries).
        - Anything else, or payments that are not ours / no longer pending → acknowledged and ignored.

        A safety net for when the passenger closes the browser before the Checkout callback reaches us.
      security: []
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Razorpay webhook event (event, payload.payment.entity, ...)." }
      responses:
        "200":
          description: Received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      handled: { type: string, enum: [paid, failed-attempt, rejected, ignored] }
        "400":
          description: Invalid signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/upload:
