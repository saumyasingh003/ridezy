        Call on screen load and after reconnecting. Returns whether chat and calls are open,
        why not if closed, the other participant (name, role, phone number while the ride is
        active, whether they're connected), the
        ride's ongoing call (to restore an incoming/active call UI after a refresh) and the
        WebRTC ICE servers to use.

        Open while the ride is `DRIVER_ASSIGNED`, `DRIVER_ARRIVING`, `DRIVER_ARRIVED` or
        `RIDE_STARTED`. `closedReason`: `WAITING_FOR_DRIVER` (still `SEARCHING`),
        `RIDE_COMPLETED` or `RIDE_CANCELLED`.

        Someone else's ride, or a driver who is no longer assigned → **404** (same as a ride
        that doesn't exist). ADMIN → **403**.
      responses:
