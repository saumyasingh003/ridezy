    get:
      tags: [Payments]
      operationId: getPayment
      x-status: planned
      x-required-role: PASSENGER, DRIVER, ADMIN
      summary: "[PLANNED] Get a payment"
      description: "**Planned.** **Auth:** Bearer JWT · **Role:** the payment's passenger or driver, or ADMIN."
      responses:
        "200":
          description: Payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # RATINGS & REVIEWS (planned)
