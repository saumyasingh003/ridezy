name: Docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ridezy-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker image inspect ridezy-backend:ci --format 'Built {{.RepoTags}} ({{.Size}} bytes)'
          docker run --rm --entrypoint sh ridezy-backend:ci -c "node --version && test -f dist/server.js && echo 'dist/server.js present'"
