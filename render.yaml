# Render Blueprint for the Ridezy backend (Express + Socket.IO).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are
# asked for once in the dashboard and never stored in git.
#
# The frontend (ridezy/) is deployed separately on Vercel.

services:
  - type: web
    name: ridezy-backend
    runtime: node
    rootDir: backend
    # free: sleeps after 15 min without traffic (first request then takes ~1 min).
    # starter or above: always on, which suits live chat/tracking sockets.
    plan: free
    region: singapore # closest Render region to India
    # --include=dev: TypeScript is a devDependency and NODE_ENV=production would skip it.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # ---- Runtime ----
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      # Tests-only package: don't download a MongoDB binary during the build.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"

      # ---- Database ----
      - key: MONGODB_URI
        sync: false

      # ---- Auth secrets (generated by Render; separate from your local ones) ----
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # ---- Frontend (your Vercel URL, e.g. https://ridezy.vercel.app) ----
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false

      # ---- Email (required in production) ----
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ---- Image storage: Supabase ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLIC_BUCKET
        sync: false
      - key: SUPABASE_PRIVATE_BUCKET
        sync: false

      # ---- Payments: Razorpay ----
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ---- Rides (same defaults as development; change freely) ----
      - key: ROUTING_PROVIDER
        value: osrm
      - key: MATCH_ALL_DRIVERS
        value: "true"
